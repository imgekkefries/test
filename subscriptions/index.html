<script>
(function(){"use strict";var c=document.getElementById("notificationContainer"),id=0,active=[];
function rm(n,skip){var idx=active.findIndex(x=>x.el===n);if(idx!==-1){if(active[idx].t)clearTimeout(active[idx].t);active.splice(idx,1)}if(skip){n.remove();return}n.classList.remove("show");n.classList.add("fade-out");setTimeout(()=>n.remove(),250)}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
window.showNotification=function(type,title,msg,dur){dur=dur===undefined?4000:dur;var i=++id,n=document.createElement("div");n.className="notification "+type;n.dataset.id=i;var ic="info-circle";if(type==="success")ic="check-circle";else if(type==="error")ic="times-circle";else if(type==="warning")ic="exclamation-triangle";n.innerHTML='<div class="notification-icon"><i class="fas fa-'+ic+'"></i></div><div class="notification-content"><div class="notification-title">'+esc(title)+'</div><div class="notification-message">'+esc(msg)+'</div></div><button class="notification-close"><i class="fas fa-times"></i></button>';c.appendChild(n);n.querySelector(".notification-close").addEventListener("click",function(e){e.stopPropagation();rm(n)});requestAnimationFrame(function(){requestAnimationFrame(function(){n.classList.add("show")})});var t=null;if(dur>0)t=setTimeout(function(){rm(n)},dur);active.push({el:n,t:t});if(active.length>15)active=active.slice(-15);return i};

<script>
(function(){"use strict";var REFRESH=5000,lastBal=null,lastState;
function setIn(v){var t=document.getElementById("topbar");if(t)t.classList.toggle("is-logged-in",v)}

async function refresh(){

<script>
(function(){"use strict";

var catalogue=null,mineCache=[];

function fmtMoney(n){return "€"+(Number(n)||0).toFixed(2)}
function fmtDate(u){if(!u)return "-";var d=new Date(u*1000),p=n=>String(n).padStart(2,"0");return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
function fmtDuration(sec){sec=Math.max(0,Math.floor(Number(sec)||0));var d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;if(d>0)return d+"d "+h+"h";if(h>0)return h+"h "+m+"m";if(m>0)return m+"m "+s+"s";return s+"s"}
function fmtDays(d){d=Number(d)||0;return d+(d===1?" day":" days")}

function renderPlans(){
  if(!catalogue){plansEl.innerHTML='<div class="empty">Catalogue unavailable</div>';return}
  var keys=Object.keys(catalogue);
  plansCountEl.textContent=keys.length+" plan"+(keys.length===1?"":"s");
  if(!keys.length){plansEl.innerHTML='<div class="empty">No plans available</div>';return}
  plansEl.innerHTML=keys.map(function(name){
    var p=catalogue[name]||{};
    return '<div class="plan-card">'+
      '<div class="plan-name">'+esc(name)+'</div>'+
      '<div class="plan-price">'+fmtMoney(p.price)+'<span class="per">/ one-time</span></div>'+
      '<div class="plan-desc">'+esc(p.description||"")+'</div>'+
      '<div class="plan-meta">'+
        '<div><div class="label">Duration</div><div class="value">'+fmtDays(p.days)+'</div></div>'+
        '<div><div class="label">Solves / day</div><div class="value">'+(Number(p.solves_per_day)||0)+'</div></div>'+
      '</div>'+
      '<div class="plan-actions"><button class="cta" data-buy="'+esc(name)+'">Purchase</button></div>'+
    '</div>'
  }).join("");
  plansEl.querySelectorAll("[data-buy]").forEach(function(btn){btn.addEventListener("click",function(){purchase(btn.dataset.buy,btn)})});
}

async function loadPlans(){
  try{var d=await getJSON("/solutions/subscriptions");if(d.code===200){catalogue=d.subscriptions||{};renderPlans();return}}catch(e){}
  renderPlans();
}

function setStats(active){
  if(active){stActive.textContent=active.name||"-";stSolves.textContent=(active.solves_left||0)+"/"+(active.total_solves||0);stTime.textContent=fmtDuration(active.time_left||0);}
  else{stActive.textContent="None";stSolves.textContent="-";stTime.textContent="-";}
}

function renderMine(subs,active){
  mineCache=subs||[];
  mineCountEl.textContent=mineCache.length+" subscription"+(mineCache.length===1?"":"s");
  if(!mineCache.length){mineEl.innerHTML='<div class="empty">No subscriptions yet. Pick a plan above to get started.</div>';return}
  var rows=mineCache.map(function(s){
    var isAct=active&&active.id===s.id;
    var pill=isAct?'<span class="status-pill active">Active</span>':'<span class="status-pill expired">Idle</span>';
    return '<tr class="'+(isAct?"is-active":"")+'">'+
      '<td class="name">'+esc(s.name)+'</td>'+
      '<td>'+pill+'</td>'+
      '<td class="num">'+(s.solves_left||0)+" / "+(s.total_solves||0)+'</td>'+
      '<td class="num" data-time="'+s.id+'">'+fmtDuration(s.time_left||0)+'</td>'+
      '<td class="date">'+fmtDate(s.purchased_at)+'</td>'+
    '</tr>'
  }).join("");
  mineEl.innerHTML='<table class="recent"><thead><tr><th>Plan</th><th>Status</th><th class="right">Solves</th><th class="right">Time left</th><th class="right">Purchased</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function renderHistory(items){
  histCountEl.textContent=(items||[]).length+" purchase"+((items||[]).length===1?"":"s");
  if(!items||!items.length){histEl.innerHTML='<div class="empty">No purchases yet.</div>';return}
  var rows=items.map(function(p){
    return '<tr>'+
      '<td class="name">'+esc(p.subscription||p.name||"-")+'</td>'+
      '<td class="num">'+fmtMoney(p.price)+'</td>'+
      '<td class="num">'+(Number(p.solves_per_day)||0)+'</td>'+
      '<td class="num">'+fmtDays(p.days)+'</td>'+
      '<td class="date">'+esc(p.purchased_at_cet||fmtDate(p.purchased_at))+'</td>'+
    '</tr>'
  }).join("");
  histEl.innerHTML='<table class="recent"><thead><tr><th>Plan</th><th class="right">Price</th><th class="right">Solves/day</th><th class="right">Days</th><th class="right">Purchased (CET)</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function renderGuest(){
  setStats(null);
  mineCountEl.textContent="-";
  mineEl.innerHTML='<div class="empty"><div>Log in or register to see your subscriptions.</div><div class="row"><a class="cta ghost" href="login">Login</a><a class="cta" href="register">Register</a></div></div>';
  histCountEl.textContent="-";
  histEl.innerHTML='<div class="empty"><div>Log in to view your purchase history.</div></div>';
}

async function loadMine(){
  var k=getKey();if(!k){renderGuest();return}
  try{var d=await postJSON("/solutions/subscriptions/mine",{key:k});
    if(d.code===401){clearKey();renderGuest();return}
    if(d.code===200){setStats(d.active||null);renderMine(d.subscriptions||[],d.active||null)}
  }catch(e){}
}

async function loadHistory(){
  var k=getKey();if(!k)return;
  try{var d=await postJSON("/solutions/subscriptions/purchases",{key:k});
    if(d.code===200)renderHistory(d.purchases||[])
  }catch(e){}
}

async function purchase(plan,btn){
  var k=getKey();
  if(!k){notify.warning("Not logged in","Register or log in to purchase a subscription.");return}
  var p=catalogue&&catalogue[plan];
  if(!p){notify.error("Unknown plan","That plan no longer exists.");return}
  btn.disabled=true;var prev=btn.textContent;btn.textContent="Purchasing...";
  try{
    var d=await postJSON("/solutions/subscriptions/purchase",{key:k,plan:plan});
    if(d.code===201){notify.success("Purchased",plan+" is now in your subscriptions.");loadMine();loadHistory();window.refreshTopbarBalance&&window.refreshTopbarBalance()}
    else if(d.code===402){notify.error("Not enough balance","Top up your balance first, then try again.")}
    else if(d.code===401){clearKey();renderGuest();notify.error("Session expired","Please log in again.")}
    else{notify.error("Purchase failed",d.error||("Code "+d.code))}
  }catch(e){notify.error("Purchase failed",String(e))}
  finally{btn.disabled=false;btn.textContent=prev}
}

// live countdown on displayed time cells
setInterval(function(){
  mineCache.forEach(function(s){s.time_left=Math.max(0,(s.time_left||0)-1)});
  document.querySelectorAll("[data-time]").forEach(function(td){
    var id=td.getAttribute("data-time"),s=mineCache.find(function(x){return x.id===id});
    if(s)td.textContent=fmtDuration(s.time_left)
  });
  if(mineCache.length){var act=mineCache.find(function(s){return s.active});if(act)setStats(act)}
},1000);

window.onLoggedOut=function(){renderGuest()};

loadPlans();
loadMine();
loadHistory();
setInterval(function(){loadMine();loadHistory()},15000);
})();
</script>
</body>
</html>
